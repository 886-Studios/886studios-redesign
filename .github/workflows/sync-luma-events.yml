name: Sync Luma events

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-luma-events
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Update the event archive
        run: node scripts/sync-luma-events.mjs
      - name: Detect event changes
        id: changes
        run: |
          if ! git diff --quiet -- src/data/luma-events.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci
      - name: Validate before publishing event changes
        if: steps.changes.outputs.changed == 'true'
        run: npm run validate
        env:
          VERCEL: "1"
          VERCEL_ENV: production
      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add src/data/luma-events.json
          if git diff --cached --quiet; then
            echo "The event archive is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Luma events"
          git push
