<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg3" cx="30%" cy="65%" r="70%">
      <stop offset="0%" stop-color="#0f0a24"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <radialGradient id="glow3a" cx="30%" cy="70%" r="38%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3b" cx="70%" cy="30%" r="38%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <rect width="800" height="600" fill="url(#glow3a)"/>
  <rect width="800" height="600" fill="url(#glow3b)"/>
  <pattern id="dots3" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#8b5cf6" fill-opacity="0.11"/>
  </pattern>
  <rect width="800" height="600" fill="url(#dots3)"/>
  <!-- Network nodes and connections -->
  <!-- Center hub -->
  <circle cx="400" cy="280" r="20" fill="#3b0764" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.8"/>
  <circle cx="400" cy="280" r="8" fill="#8b5cf6" fill-opacity="0.9"/>
  <!-- Satellite nodes -->
  <circle cx="260" cy="200" r="14" fill="#1a0a30" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.7"/>
  <circle cx="260" cy="200" r="5" fill="#6d28d9" fill-opacity="0.8"/>
  <circle cx="540" cy="190" r="16" fill="#1a0a30" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.7"/>
  <circle cx="540" cy="190" r="6" fill="#7c3aed" fill-opacity="0.8"/>
  <circle cx="560" cy="370" r="14" fill="#1a0a30" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.65"/>
  <circle cx="560" cy="370" r="5" fill="#6d28d9" fill-opacity="0.75"/>
  <circle cx="240" cy="370" r="12" fill="#1a0a30" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="240" cy="370" r="4" fill="#6d28d9" fill-opacity="0.7"/>
  <circle cx="400" cy="160" r="11" fill="#12121c" stroke="#4c1d95" stroke-width="1" stroke-opacity="0.55"/>
  <circle cx="400" cy="160" r="4" fill="#4c1d95" fill-opacity="0.7"/>
  <circle cx="630" cy="290" r="10" fill="#12121c" stroke="#4c1d95" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="630" cy="290" r="4" fill="#4c1d95" fill-opacity="0.65"/>
  <circle cx="170" cy="290" r="10" fill="#12121c" stroke="#4c1d95" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="170" cy="290" r="4" fill="#4c1d95" fill-opacity="0.65"/>
  <!-- Connection lines (center to satellites) -->
  <line x1="400" y1="280" x2="260" y2="200" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="400" y1="280" x2="540" y2="190" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="400" y1="280" x2="560" y2="370" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="400" y1="280" x2="240" y2="370" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="400" y1="280" x2="400" y2="160" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="400" y1="280" x2="630" y2="290" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="400" y1="280" x2="170" y2="290" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Cross connections -->
  <line x1="260" y1="200" x2="400" y2="160" stroke="#6d28d9" stroke-width="0.7" stroke-opacity="0.15"/>
  <line x1="540" y1="190" x2="630" y2="290" stroke="#6d28d9" stroke-width="0.7" stroke-opacity="0.15"/>
  <line x1="560" y1="370" x2="630" y2="290" stroke="#6d28d9" stroke-width="0.7" stroke-opacity="0.15"/>
  <line x1="240" y1="370" x2="170" y2="290" stroke="#6d28d9" stroke-width="0.7" stroke-opacity="0.15"/>
  <!-- Caption -->
  <rect x="0" y="510" width="800" height="90" fill="#050507" fill-opacity="0.88"/>
  <text x="400" y="552" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(167,139,250,0.5)" letter-spacing="4">NETWORKING NIGHT</text>
  <text x="400" y="574" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="2">EVENT PHOTO PLACEHOLDER</text>
</svg>
