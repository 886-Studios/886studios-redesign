<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg2" cx="62%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#12082a"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
    <radialGradient id="glow2" cx="60%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <rect width="800" height="600" fill="url(#glow2)"/>
  <pattern id="dots2" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#8b5cf6" fill-opacity="0.1"/>
  </pattern>
  <rect width="800" height="600" fill="url(#dots2)"/>
  <!-- Presentation screen -->
  <rect x="236" y="158" width="328" height="210" rx="6" fill="#0d0d18" stroke="#252538" stroke-width="1.5"/>
  <!-- Screen glow -->
  <rect x="244" y="166" width="312" height="194" rx="3" fill="#0d0118" fill-opacity="0.6"/>
  <!-- Bar chart inside screen -->
  <rect x="280" y="280" width="28" height="60" rx="2" fill="#6d28d9" fill-opacity="0.7"/>
  <rect x="320" y="258" width="28" height="82" rx="2" fill="#7c3aed" fill-opacity="0.8"/>
  <rect x="360" y="238" width="28" height="102" rx="2" fill="#8b5cf6" fill-opacity="0.85"/>
  <rect x="400" y="246" width="28" height="94" rx="2" fill="#7c3aed" fill-opacity="0.75"/>
  <rect x="440" y="222" width="28" height="118" rx="2" fill="#a78bfa" fill-opacity="0.9"/>
  <rect x="480" y="252" width="28" height="88" rx="2" fill="#7c3aed" fill-opacity="0.7"/>
  <!-- Chart baseline -->
  <line x1="270" y1="342" x2="530" y2="342" stroke="#252538" stroke-width="1"/>
  <!-- Screen title text -->
  <rect x="280" y="180" width="80" height="5" rx="2" fill="#a78bfa" fill-opacity="0.35"/>
  <rect x="280" y="192" width="120" height="4" rx="2" fill="#6d28d9" fill-opacity="0.25"/>
  <!-- Stand -->
  <rect x="378" y="368" width="44" height="10" rx="1" fill="#1a1a28" stroke="#252538" stroke-width="1"/>
  <rect x="350" y="378" width="100" height="6" rx="2" fill="#1a1a28" stroke="#252538" stroke-width="1"/>
  <!-- Presenter dot (person) -->
  <circle cx="580" cy="300" r="16" fill="#1a1228" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="580" cy="290" r="7" fill="#6d28d9" fill-opacity="0.7"/>
  <ellipse cx="580" cy="315" rx="11" ry="8" fill="#6d28d9" fill-opacity="0.5"/>
  <!-- Audience dots -->
  <circle cx="200" cy="390" r="9" fill="#1a1228" stroke="#4c1d95" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="226" cy="398" r="7" fill="#1a1228" stroke="#4c1d95" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="170" cy="402" r="7" fill="#1a1228" stroke="#4c1d95" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Caption -->
  <rect x="0" y="510" width="800" height="90" fill="#050507" fill-opacity="0.88"/>
  <text x="400" y="552" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(167,139,250,0.5)" letter-spacing="4">DEMO DAY</text>
  <text x="400" y="574" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="2">EVENT PHOTO PLACEHOLDER</text>
</svg>
