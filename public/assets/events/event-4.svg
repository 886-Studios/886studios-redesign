<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#16082a"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <radialGradient id="glow4" cx="50%" cy="58%" r="35%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow4b" cx="50%" cy="58%" r="20%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <rect width="800" height="600" fill="url(#glow4)"/>
  <rect width="800" height="600" fill="url(#glow4b)"/>
  <pattern id="dots4" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#8b5cf6" fill-opacity="0.1"/>
  </pattern>
  <rect width="800" height="600" fill="url(#dots4)"/>
  <!-- Two chairs facing each other (fireside chat) -->
  <!-- Chair 1 (left, facing right) -->
  <rect x="218" y="310" width="100" height="60" rx="4" fill="#12121c" stroke="#252538" stroke-width="1.2"/>
  <rect x="208" y="255" width="18" height="115" rx="3" fill="#12121c" stroke="#252538" stroke-width="1"/>
  <rect x="218" y="255" width="100" height="60" rx="4" fill="#1a1a28" stroke="#252538" stroke-width="1.2"/>
  <rect x="298" y="280" width="18" height="90" rx="3" fill="#12121c" stroke="#252538" stroke-width="1"/>
  <line x1="228" y1="370" x2="228" y2="400" stroke="#252538" stroke-width="3" stroke-linecap="round"/>
  <line x1="308" y1="370" x2="308" y2="400" stroke="#252538" stroke-width="3" stroke-linecap="round"/>
  <!-- Chair 2 (right, facing left) -->
  <rect x="482" y="310" width="100" height="60" rx="4" fill="#12121c" stroke="#252538" stroke-width="1.2"/>
  <rect x="574" y="255" width="18" height="115" rx="3" fill="#12121c" stroke="#252538" stroke-width="1"/>
  <rect x="482" y="255" width="100" height="60" rx="4" fill="#1a1a28" stroke="#252538" stroke-width="1.2"/>
  <rect x="484" y="280" width="18" height="90" rx="3" fill="#12121c" stroke="#252538" stroke-width="1"/>
  <line x1="492" y1="370" x2="492" y2="400" stroke="#252538" stroke-width="3" stroke-linecap="round"/>
  <line x1="572" y1="370" x2="572" y2="400" stroke="#252538" stroke-width="3" stroke-linecap="round"/>
  <!-- Person 1 (left chair) -->
  <circle cx="268" cy="238" r="22" fill="#1a0a30" stroke="#7c3aed" stroke-width="1.3" stroke-opacity="0.7"/>
  <circle cx="268" cy="230" r="10" fill="#6d28d9" fill-opacity="0.8"/>
  <ellipse cx="268" cy="256" rx="16" ry="10" fill="#6d28d9" fill-opacity="0.55"/>
  <!-- Person 2 (right chair) -->
  <circle cx="532" cy="238" r="22" fill="#1a0a30" stroke="#7c3aed" stroke-width="1.3" stroke-opacity="0.7"/>
  <circle cx="532" cy="230" r="10" fill="#6d28d9" fill-opacity="0.8"/>
  <ellipse cx="532" cy="256" rx="16" ry="10" fill="#6d28d9" fill-opacity="0.55"/>
  <!-- Flame / center glow -->
  <ellipse cx="400" cy="350" rx="22" ry="8" fill="#6d28d9" fill-opacity="0.35"/>
  <ellipse cx="400" cy="332" rx="12" ry="18" fill="#8b5cf6" fill-opacity="0.4"/>
  <ellipse cx="400" cy="322" rx="7" ry="12" fill="#c4b5fd" fill-opacity="0.3"/>
  <!-- Ground line -->
  <line x1="180" y1="402" x2="620" y2="402" stroke="#1a1a28" stroke-width="1"/>
  <!-- Caption -->
  <rect x="0" y="510" width="800" height="90" fill="#050507" fill-opacity="0.88"/>
  <text x="400" y="552" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(167,139,250,0.5)" letter-spacing="4">FIRESIDE CHAT</text>
  <text x="400" y="574" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="2">EVENT PHOTO PLACEHOLDER</text>
</svg>
