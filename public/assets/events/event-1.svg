<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg1" cx="38%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#1a0a30"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <rect width="800" height="600" fill="url(#glow1)"/>
  <!-- Grid dots -->
  <pattern id="dots1" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#8b5cf6" fill-opacity="0.12"/>
  </pattern>
  <rect width="800" height="600" fill="url(#dots1)"/>
  <!-- People silhouettes in circle -->
  <circle cx="400" cy="255" r="58" fill="none" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="400" cy="255" r="90" fill="none" stroke="#6d28d9" stroke-width="0.5" stroke-opacity="0.2"/>
  <!-- Person 1 (center) -->
  <circle cx="400" cy="238" r="14" fill="#7c3aed" fill-opacity="0.85"/>
  <ellipse cx="400" cy="274" rx="22" ry="14" fill="#7c3aed" fill-opacity="0.6"/>
  <!-- Person 2 (left) -->
  <circle cx="338" cy="278" r="11" fill="#6d28d9" fill-opacity="0.75"/>
  <ellipse cx="338" cy="306" rx="17" ry="11" fill="#6d28d9" fill-opacity="0.5"/>
  <!-- Person 3 (right) -->
  <circle cx="462" cy="278" r="11" fill="#6d28d9" fill-opacity="0.75"/>
  <ellipse cx="462" cy="306" rx="17" ry="11" fill="#6d28d9" fill-opacity="0.5"/>
  <!-- Person 4 (far left) -->
  <circle cx="298" cy="248" r="9" fill="#4c1d95" fill-opacity="0.65"/>
  <ellipse cx="298" cy="270" rx="14" ry="9" fill="#4c1d95" fill-opacity="0.4"/>
  <!-- Person 5 (far right) -->
  <circle cx="502" cy="248" r="9" fill="#4c1d95" fill-opacity="0.65"/>
  <ellipse cx="502" cy="270" rx="14" ry="9" fill="#4c1d95" fill-opacity="0.4"/>
  <!-- Connection lines -->
  <line x1="400" y1="255" x2="338" y2="285" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.25"/>
  <line x1="400" y1="255" x2="462" y2="285" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.25"/>
  <line x1="338" y1="285" x2="298" y2="258" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.15"/>
  <line x1="462" y1="285" x2="502" y2="258" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.15"/>
  <!-- Caption bar -->
  <rect x="0" y="510" width="800" height="90" fill="url(#bg1)" fill-opacity="0.85"/>
  <text x="400" y="552" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(167,139,250,0.5)" letter-spacing="4">COMMUNITY MEETUP</text>
  <text x="400" y="574" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="2">EVENT PHOTO PLACEHOLDER</text>
</svg>
