<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e062a"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <radialGradient id="spotlight5" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg5)"/>
  <rect width="800" height="600" fill="url(#spotlight5)"/>
  <pattern id="dots5" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#8b5cf6" fill-opacity="0.1"/>
  </pattern>
  <rect width="800" height="600" fill="url(#dots5)"/>
  <!-- Stage spotlight cone -->
  <polygon points="400,80 280,420 520,420" fill="#a78bfa" fill-opacity="0.05"/>
  <polygon points="400,80 300,420 500,420" fill="#a78bfa" fill-opacity="0.04"/>
  <polygon points="400,80 320,420 480,420" fill="#a78bfa" fill-opacity="0.04"/>
  <!-- Stage platform -->
  <rect x="200" y="408" width="400" height="14" rx="3" fill="#12121c" stroke="#252538" stroke-width="1.2"/>
  <!-- Speaker silhouette -->
  <circle cx="400" cy="340" r="26" fill="#1a0a30" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.75"/>
  <circle cx="400" cy="328" r="12" fill="#7c3aed" fill-opacity="0.85"/>
  <ellipse cx="400" cy="368" rx="20" ry="13" fill="#6d28d9" fill-opacity="0.65"/>
  <!-- Microphone stand -->
  <line x1="400" y1="380" x2="400" y2="408" stroke="#252538" stroke-width="2"/>
  <ellipse cx="400" cy="328" rx="5" ry="7" fill="#a78bfa" fill-opacity="0.5"/>
  <!-- Audience rows -->
  <ellipse cx="280" cy="458" rx="11" ry="8" fill="#0d0d15" stroke="#1a1a28" stroke-width="1"/>
  <ellipse cx="320" cy="452" rx="11" ry="8" fill="#0d0d15" stroke="#1a1a28" stroke-width="1"/>
  <ellipse cx="360" cy="450" rx="11" ry="8" fill="#0d0d15" stroke="#1a1a28" stroke-width="1"/>
  <ellipse cx="400" cy="450" rx="11" ry="8" fill="#0d0d15" stroke="#1a1a28" stroke-width="1"/>
  <ellipse cx="440" cy="450" rx="11" ry="8" fill="#0d0d15" stroke="#1a1a28" stroke-width="1"/>
  <ellipse cx="480" cy="452" rx="11" ry="8" fill="#0d0d15" stroke="#1a1a28" stroke-width="1"/>
  <ellipse cx="520" cy="458" rx="11" ry="8" fill="#0d0d15" stroke="#1a1a28" stroke-width="1"/>
  <!-- Second row (lighter, further back) -->
  <ellipse cx="260" cy="476" rx="9" ry="6" fill="#0d0d15" stroke="#1a1a28" stroke-width="0.8" stroke-opacity="0.6"/>
  <ellipse cx="300" cy="470" rx="9" ry="6" fill="#0d0d15" stroke="#1a1a28" stroke-width="0.8" stroke-opacity="0.6"/>
  <ellipse cx="340" cy="468" rx="9" ry="6" fill="#0d0d15" stroke="#1a1a28" stroke-width="0.8" stroke-opacity="0.6"/>
  <ellipse cx="400" cy="468" rx="9" ry="6" fill="#0d0d15" stroke="#1a1a28" stroke-width="0.8" stroke-opacity="0.6"/>
  <ellipse cx="460" cy="468" rx="9" ry="6" fill="#0d0d15" stroke="#1a1a28" stroke-width="0.8" stroke-opacity="0.6"/>
  <ellipse cx="500" cy="470" rx="9" ry="6" fill="#0d0d15" stroke="#1a1a28" stroke-width="0.8" stroke-opacity="0.6"/>
  <ellipse cx="540" cy="476" rx="9" ry="6" fill="#0d0d15" stroke="#1a1a28" stroke-width="0.8" stroke-opacity="0.6"/>
  <!-- Light source halo at top -->
  <ellipse cx="400" cy="82" rx="18" ry="10" fill="#c4b5fd" fill-opacity="0.25"/>
  <ellipse cx="400" cy="82" rx="8" ry="5" fill="#c4b5fd" fill-opacity="0.4"/>
  <!-- Caption -->
  <rect x="0" y="510" width="800" height="90" fill="#050507" fill-opacity="0.88"/>
  <text x="400" y="552" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(167,139,250,0.5)" letter-spacing="4">PITCH NIGHT</text>
  <text x="400" y="574" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="2">EVENT PHOTO PLACEHOLDER</text>
</svg>
