<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>886 Studios Before / After</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0c10;
        --panel: #16161c;
        --line: #30303a;
        --text: #f5f5f7;
        --muted: #a3a3ad;
        --accent: #8b5cf6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1280px, calc(100% - 40px));
        margin: 0 auto;
        padding: 40px 0 64px;
      }

      header {
        margin-bottom: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 34px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      section {
        margin-top: 34px;
        border-top: 1px solid var(--line);
        padding-top: 24px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 22px;
        letter-spacing: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      figure {
        margin: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .tag {
        color: var(--accent);
      }

      img {
        display: block;
        width: 100%;
        height: min(72vh, 720px);
        object-fit: cover;
        object-position: top center;
        background: #fff;
      }

      @media (max-width: 820px) {
        main {
          width: min(100% - 24px, 640px);
          padding-top: 24px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        img {
          height: 620px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>886 Studios Before / After</h1>
        <p>Simple comparison screenshots for the landing page, about page, and programs page.</p>
      </header>

      <section>
        <h2>Landing Page</h2>
        <div class="grid">
          <figure>
            <figcaption><span>Before</span></figcaption>
            <img src="assets/landing-before.png" alt="Old landing page screenshot" />
          </figure>
          <figure>
            <figcaption><span>After</span></figcaption>
            <img src="assets/landing-after.png" alt="New landing page screenshot" />
          </figure>
        </div>
      </section>

      <section>
        <h2>About Page</h2>
        <div class="grid">
          <figure>
            <figcaption><span>Before</span></figcaption>
            <img src="assets/about-before.png" alt="Old about page screenshot" />
          </figure>
          <figure>
            <figcaption><span>After</span></figcaption>
            <img src="assets/about-after.png" alt="New about page screenshot" />
          </figure>
        </div>
      </section>

      <section>
        <h2>Programs Page</h2>
        <div class="grid">
          <figure>
            <figcaption><span>Before</span></figcaption>
            <img src="assets/programs-before.png" alt="Old programs page screenshot" />
          </figure>
          <figure>
            <figcaption><span>After</span></figcaption>
            <img src="assets/programs-after.png" alt="New programs page screenshot" />
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
